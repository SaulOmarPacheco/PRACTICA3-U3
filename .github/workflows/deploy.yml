
name: PRACTICA3-U3 - Docker CI/CD

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - closed

permissions:
  contents: read

jobs:

  verificar:
    name: Verificar Docker
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verificar construccion Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: practica3-u3:test

  publicar:
    name: Publicar Docker Hub
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.title, 'v')

    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo de main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Obtener version del Pull Request
        id: version
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          if [[ "$PR_TITLE" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)([[:space:]]|$) ]]; then
            VERSION="${BASH_REMATCH[1]}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Version detectada: $VERSION"
          else
            echo "ERROR: titulo invalido."
            echo "Ejemplo: v1.0.0 - Modulo Libros"
            exit 1
          fi

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/practica3-u3:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/practica3-u3:latest

      - name: Confirmar publicacion
        run: |
          echo "Imagen publicada correctamente"
          echo "Version: ${{ steps.version.outputs.version }}"
