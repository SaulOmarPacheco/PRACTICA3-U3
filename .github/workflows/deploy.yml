
name: PRACTICA3-U3 - CI y Versionado

run-name: ${{ github.event.pull_request.title }}

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: read

jobs:
  verificar:
    name: Verificar Docker
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verificar imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: practica3-u3:test

  crear_tag:
    name: Crear tag de version
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.title, 'v')

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Descargar codigo integrado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Obtener y validar version
        id: version
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          if [[ "$PR_TITLE" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+)([[:space:]]|$) ]]; then
            TAG="${BASH_REMATCH[1]}"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "Error: usa v1.0.0 - Descripcion"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Error: el tag $TAG ya existe"
            exit 1
          fi

      - name: Crear y publicar tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      - name: Resumen
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          echo "### Tag creado: $TAG" >> "$GITHUB_STEP_SUMMARY"
